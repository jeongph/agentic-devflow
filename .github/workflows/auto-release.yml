name: Auto release

# 판정 규칙과 스크립트는 jeongph/claude-plugins 에 있다.
# 규칙을 바꾸려면 그 레포의 .github/scripts/next-version.sh 를 고친다.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check.sh
      - run: bash scripts/check-selftest.sh
  release:
    needs: check
    uses: jeongph/claude-plugins/.github/workflows/auto-release.yml@main
    permissions:
      contents: write
